    <script>
        (function() {
            function showError(title, message) {
                let div = document.getElementById("debug-error-banner");
                if (!div) {
                    div = document.createElement("div");
                    div.id = "debug-error-banner";
                    div.style.position = "fixed";
                    div.style.top = "10px";
                    div.style.left = "10px";
                    div.style.right = "10px";
                    div.style.background = "#ff3b30";
                    div.style.color = "#ffffff";
                    div.style.padding = "15px";
                    div.style.fontFamily = "monospace";
                    div.style.fontSize = "12px";
                    div.style.zIndex = "999999";
                    div.style.borderRadius = "8px";
                    div.style.boxShadow = "0 4px 12px rgba(0,0,0,0.5)";
                    div.style.whiteSpace = "pre-wrap";
                    div.style.overflowY = "auto";
                    div.style.maxHeight = "50vh";
                    document.body.appendChild(div);
                }
                div.textContent = title + "\n\n" + message;
            }
            const originalConsoleError = console.error;
            console.error = function(...args) {
                originalConsoleError.apply(console, args);
                const errorMsg = args.map(a => typeof a === 'object' ? (a.message || JSON.stringify(a)) : String(a)).join(" ");
                if (errorMsg.includes("Babel") || errorMsg.includes("SyntaxError") || errorMsg.includes("Failed") || errorMsg.includes("error") || errorMsg.includes("ReferenceError")) {
                    showError("CONSOLE ERROR DETECTED", errorMsg);
                }
            };
            window.onerror = function(message, source, lineno, colno, error) {
                showError("UNCAUGHT RUNTIME EXCEPTION", message + "\nSource: " + source + "\nLine: " + lineno + ":" + colno + (error ? "\nStack: " + error.stack : ""));
                return false;
            };
        })();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================================================
        // 1. DATA LAYERS & UTILS
        // ==========================================================================
        const db = {
            get: (table) => {
                try {
                    return JSON.parse(localStorage.getItem(table) || "[]");
                } catch (e) {
                    console.error("Failed to parse localStorage table: " + table, e);
                    return [];
                }
            },
            set: (table, data) => {
                try {
                    localStorage.setItem(table, JSON.stringify(data));
                } catch (e) {
                    console.error("Failed to set localStorage table: " + table, e);
                }
            },
            getCurrentUser: () => {
                try {
                    const u = sessionStorage.getItem("pt_current_user") || localStorage.getItem("pt_current_user");
                    return u ? JSON.parse(u) : null;
                } catch (e) {
                    console.error("Failed to get current user", e);
                    return null;
                }
            },
            setCurrentUser: (user, remember = false) => {
                try {
                    const uStr = JSON.stringify(user);
                    if (remember) {
                        localStorage.setItem("pt_current_user", uStr);
                    } else {
                        sessionStorage.setItem("pt_current_user", uStr);
                    }
                } catch (e) {
                    console.error("Failed to set current user", e);
                }
            },
            clearCurrentUser: () => {
                localStorage.removeItem("pt_current_user");
                sessionStorage.removeItem("pt_current_user");
            }
        };

        function hashPassword(password) {
            let hash = 0;
            if (password.length === 0) return hash.toString();
            for (let i = 0; i < password.length; i++) {
                const chr = password.charCodeAt(i);
                hash = ((hash << 5) - hash) + chr;
                hash |= 0;
            }
            return "SHA256Mock_" + Math.abs(hash).toString(16);
        }

        function generateRandomCode(length = 6) {
            let result = '';
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function generate6DigitCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        function Icon({ name, className = "" }) {
            const iconObj = (() => {
                if (typeof lucide === 'undefined' || !lucide.icons) return null;
                const camel = name.replace(/-([a-z0-9])/gi, (g) => g[1].toUpperCase());
                if (lucide.icons[camel]) return lucide.icons[camel];
                if (lucide.icons[name]) return lucide.icons[name];
                const pascal = camel.charAt(0).toUpperCase() + camel.slice(1);
                if (lucide.icons[pascal]) return lucide.icons[pascal];
                return null;
            })();

            if (!iconObj) {
                return <span className={className}>[Icon: {name}]</span>;
            }

            if (typeof iconObj.toSvg === 'function') {
                const html = iconObj.toSvg({ class: className });
                return <span className="inline-flex items-center justify-center flex-shrink-0" dangerouslySetInnerHTML={{ __html: html }} />;
            }

            if (Array.isArray(iconObj)) {
                return (
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="2"
                        strokeLinecap="round"
                        strokeLinejoin="round"
                        className={`inline-block flex-shrink-0 ${className}`}
                    >
                        {iconObj.map(([tag, attrs], idx) => {
                            const TagName = tag;
                            const cleanAttrs = {};
                            Object.keys(attrs).forEach(k => {
                                const camelKey = k.replace(/-([a-z])/g, (g) => g[1].toUpperCase());
                                cleanAttrs[camelKey] = attrs[k];
                            });
                            return <TagName key={idx} {...cleanAttrs} />;
                        })}
                    </svg>
                );
            }

            return <span className={className}>[Icon: {name}]</span>;
        }

        function ParticleBackground() {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext("2d");
                let particles = [];
                const maxParticles = 75;
                let mouse = { x: null, y: null, radius: 160 };

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                resize();
                window.addEventListener("resize", resize);

                const handleMouseMove = (e) => {
                    mouse.x = e.clientX;
                    mouse.y = e.clientY;
                };
                const handleMouseLeave = () => {
                    mouse.x = null;
                    mouse.y = null;
                };
                window.addEventListener("mousemove", handleMouseMove);
                window.addEventListener("mouseleave", handleMouseLeave);

                class Particle {
                    constructor() {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        this.vx = (Math.random() - 0.5) * 0.5;
                        this.vy = (Math.random() - 0.5) * 0.5;
                        this.radius = Math.random() * 2 + 0.8;
                    }
                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                        ctx.fillStyle = "rgba(0, 102, 255, 0.35)";
                        ctx.fill();
                    }
                    update() {
                        if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                        if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;

                        if (mouse.x != null && mouse.y != null) {
                            let dx = mouse.x - this.x;
                            let dy = mouse.y - this.y;
                            let dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < mouse.radius) {
                                let force = (mouse.radius - dist) / mouse.radius;
                                this.x -= dx / dist * force * 0.7;
                                this.y -= dy / dist * force * 0.7;
                            }
                        }
                        this.x += this.vx;
                        this.y += this.vy;
                    }
                }

                for (let i = 0; i < maxParticles; i++) {
                    particles.push(new Particle());
                }

                let animationFrameId;
                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        p.update();
                        p.draw();
                    });

                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            let dx = particles[i].x - particles[j].x;
                            let dy = particles[i].y - particles[j].y;
                            let dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 100) {
                                let alpha = (100 - dist) / 100 * 0.12;
                                ctx.strokeStyle = `rgba(0, 102, 255, ${alpha})`;
                                ctx.lineWidth = 0.8;
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.stroke();
                            }
                        }
                    }
                    animationFrameId = requestAnimationFrame(animate);
                };
                animate();

                return () => {
                    window.removeEventListener("resize", resize);
                    window.removeEventListener("mousemove", handleMouseMove);
                    window.removeEventListener("mouseleave", handleMouseLeave);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full pointer-events-none z-0" />;
        }

                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const triggerSectionScroll = (id) => {
                setMobileOpen(false);

                    }, 200);

        function ProfileView({ user, setUser, triggerToast }) {
            const [username, setUsername] = useState(user.username);
            const [email, setEmail] = useState(user.email);
            const [avatar, setAvatar] = useState(user.avatar);
            const [passForm, setPassForm] = useState({ current: '', newPass: '', confirm: '' });

            const avatarChoices = [
                "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=120&auto=format&fit=crop",
                "https://images.unsplash.com/photo-1614741118887-7a4ee193a5fa?q=80&w=120&auto=format&fit=crop",
                "https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=120&auto=format&fit=crop",
                "https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?q=80&w=120&auto=format&fit=crop"
            ];

            const handleUpdateProfile = (e) => {
                e.preventDefault();
                let users = db.get("pt_users");

                // Validate unique email details
                if (email.toLowerCase() !== user.email.toLowerCase() && users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
                    triggerToast("Update Error", "This email address is already in use.", "error");
                    return;
                }

                // Update users table in storage DB
                users = users.map(u => {
                    if (u.email.toLowerCase() === user.email.toLowerCase()) {
                        u.username = username;
                        u.email = email;
                        u.avatar = avatar;
                    }
                    return u;
                });
                db.set("pt_users", users);

                // Update orders/keys referring to old email
                if (email.toLowerCase() !== user.email.toLowerCase()) {
                    let keys = db.get("pt_keys");
                    keys = keys.map(k => { if (k.userEmail === user.email) k.userEmail = email; return k; });
                    db.set("pt_keys", keys);

                    let orders = db.get("pt_orders");
                    orders = orders.map(o => { if (o.userEmail === user.email) o.userEmail = email; return o; });
                    db.set("pt_orders", orders);
                }

                const updatedUser = users.find(u => u.email.toLowerCase() === email.toLowerCase());
                db.setCurrentUser(updatedUser);
                setUser(updatedUser);
                triggerToast("Profile Updated", "Account settings saved successfully.", "success");
            };

            const handleChangePass = (e) => {
                e.preventDefault();
                if (hashPassword(passForm.current) !== user.passwordHash) {
                    triggerToast("Validation Failed", "Current password entered is incorrect.", "error");
                    return;
                }
                if (passForm.newPass !== passForm.confirm) {
                    triggerToast("Mismatch Error", "Passwords do not match.", "error");
                    return;
                }

                let users = db.get("pt_users");
                users = users.map(u => {
                    if (u.email.toLowerCase() === user.email.toLowerCase()) {
                        u.passwordHash = hashPassword(passForm.newPass);
                    }
                    return u;
                });
                db.set("pt_users", users);

                setPassForm({ current: '', newPass: '', confirm: '' });
                const updatedUser = users.find(u => u.email.toLowerCase() === user.email.toLowerCase());
                db.setCurrentUser(updatedUser);
                setUser(updatedUser);
                triggerToast("Password Changed", "Security parameters updated.", "success");
            };

            return (
                <div className="py-12 relative z-10">
                    <div className="max-w-2xl mx-auto px-6">
                        <div className="bg-brand-card/85 border border-brand-border p-8 rounded-2xl backdrop-blur-md text-left flex flex-col gap-8">
                            <div>
                                <h2 className="font-display font-black text-2xl text-white">Profile Settings</h2>
                                <p className="text-brand-textMuted text-xs mt-1">Configure your personal credentials and customize security passwords.</p>
                            </div>

                            {/* Avatar selector */}
                            <div className="bg-white/2 border border-brand-border p-4 rounded-xl flex items-center gap-6">
                                <div className="w-16 h-16 rounded-full overflow-hidden border-2 border-brand-blue shadow-lg shadow-brand-blue/30 flex-shrink-0">
                                    <img src={avatar} alt="Current profile picture" className="w-full h-full object-cover" />
                                </div>
                                <div className="flex flex-col gap-2">
                                    <span className="text-[10px] font-bold text-brand-textMuted tracking-wider uppercase">Select Profile Photo</span>
                                    <div className="flex gap-2">
                                        {avatarChoices.map((choice, idx) => (
                                            <img 
                                                key={idx} 
                                                src={choice} 
                                                onClick={() => setAvatar(choice)} 
                                                alt="Photo option" 
                                                className={`w-8 h-8 rounded-full object-cover cursor-pointer border hover:scale-105 transition-all ${avatar === choice ? 'border-brand-blue scale-105 shadow-md shadow-brand-blue/20' : 'border-transparent'}`} 
                                            />
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Details form */}
                            <form onSubmit={handleUpdateProfile} className="flex flex-col gap-5">
                                <div className="flex flex-col gap-2">
                                    <label className="text-xs font-semibold tracking-wider text-brand-textMuted uppercase">Username</label>
                                    <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} required minLength="3" className="bg-white/3 border border-brand-border focus:border-brand-blue focus:bg-brand-blue/3 rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition-all" />
                                </div>
                                <div className="flex flex-col gap-2">
                                    <label className="text-xs font-semibold tracking-wider text-brand-textMuted uppercase">Email Address</label>
                                    <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required className="bg-white/3 border border-brand-border focus:border-brand-blue focus:bg-brand-blue/3 rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition-all" />
                                </div>
                                <button type="submit" className="bg-brand-blue hover:bg-brand-blueHover text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-md mt-2 scale-btn text-sm font-display tracking-wide text-center">Update Settings</button>
                            </form>

                            <hr className="border-brand-border/40" />

                            {/* Password change form */}
                            <form onSubmit={handleChangePass} className="flex flex-col gap-5">
                                <h3 className="font-display font-bold text-base text-white uppercase tracking-wide">Security updates</h3>
                                <div className="flex flex-col gap-2">
                                    <label className="text-xs font-semibold tracking-wider text-brand-textMuted uppercase">Current Password</label>
                                    <input type="password" value={passForm.current} onChange={(e) => setPassForm({...passForm, current: e.target.value})} required className="bg-white/3 border border-brand-border focus:border-brand-blue focus:bg-brand-blue/3 rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition-all" />
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div className="flex flex-col gap-2">
                                        <label className="text-xs font-semibold tracking-wider text-brand-textMuted uppercase">New Password</label>
                                        <input type="password" value={passForm.newPass} onChange={(e) => setPassForm({...passForm, newPass: e.target.value})} required minLength="8" className="bg-white/3 border border-brand-border focus:border-brand-blue focus:bg-brand-blue/3 rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition-all" />
                                    </div>
                                    <div className="flex flex-col gap-2">
                                        <label className="text-xs font-semibold tracking-wider text-brand-textMuted uppercase">Confirm New Password</label>
                                        <input type="password" value={passForm.confirm} onChange={(e) => setPassForm({...passForm, confirm: e.target.value})} required className="bg-white/3 border border-brand-border focus:border-brand-blue focus:bg-brand-blue/3 rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition-all" />
                                    </div>
                                </div>
                                <button type="submit" className="bg-white/5 hover:bg-white/10 border border-brand-border hover:border-white/20 text-white font-semibold py-3 px-6 rounded-xl transition-all mt-2 scale-btn text-sm font-display tracking-wide text-center">Change Password</button>
                            </form>
                        </div>
                    </div>
                </div>
            );

        // ==========================================================================
        // 10. AUTHENTICATION PAGES (LOGIN / REGISTER / VERIFY / FORGOT / RESET)
        // ==========================================================================
        function AuthView({ authState, setAuthState, setUser, setView, triggerToast, sendMockMail, verifyEmailTarget, setVerifyEmailTarget, verificationCodes, setVerificationCodes, captcha, setCaptcha, showCaptcha, setShowCaptcha, processOrderCompletion }) {
            const [loginForm, setLoginForm] = useState({ email: '', password: '', remember: false, captchaAns: '' });
            const [regForm, setRegForm] = useState({ username: '', email: '', password: '', confirm: '' });
            const [verifyCode, setVerifyCode] = useState('');
            const [forgotEmail, setForgotEmail] = useState('');
            const [resetForm, setResetForm] = useState({ email: '', code: '', newPass: '', confirm: '' });
            const [resendCooldown, setResendCooldown] = useState(0);

            useEffect(() => {
                if (resendCooldown > 0) {
                    const t = setTimeout(() => setResendCooldown(resendCooldown - 1), 1000);
                    return () => clearTimeout(t);
                }
            }, [resendCooldown]);

            const triggerCaptchaGen = () => {
                const a = Math.floor(Math.random() * 12) + 2;
                const b = Math.floor(Math.random() * 12) + 2;
                setCaptcha({ a, b, ans: a + b });
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const failedLogins = db.get("pt_failed_logins");
                const attempts = failedLogins[loginForm.email.toLowerCase()] || { count: 0, lockTime: 0 };

                // Rate limiting lockout
                if (attempts.lockTime && Date.now() < attempts.lockTime) {
                    const remain = Math.ceil((attempts.lockTime - Date.now()) / 1000);
                    triggerToast("Account Locked", `Too many failed login attempts. Locked. Wait ${remain}s.`, "error");
                    return;
                }

                // Check math CAPTCHA
                if (attempts.count >= 3) {
                    if (parseInt(loginForm.captchaAns) !== captcha.ans) {
                        triggerToast("Captcha Failed", "Security check failed. Try again.", "error");
                        triggerCaptchaGen();
                        return;
                    }
                }

                const users = db.get("pt_users");
                const userObj = users.find(u => u.email.toLowerCase() === loginForm.email.toLowerCase());

                if (userObj && userObj.banned) {
                    triggerToast("Account Banned", "This profile has been banned due to violations.", "error");
                    return;
                }

                const hash = hashPassword(loginForm.password);
                if (userObj && userObj.passwordHash === hash) {
                    if (!userObj.verified) {
                        triggerToast("Email Unverified", "Check your inbox for your account verification code.", "error");
                        setVerifyEmailTarget(userObj.email);
                        
                        // Send new code
                        const code = generate6DigitCode();
                        const expires = Date.now() + 10 * 60 * 1000;
                        setVerificationCodes(prev => [...prev.filter(c => c.email !== userObj.email), { email: userObj.email.toLowerCase(), code, exp: expires }]);
                        sendMockMail(userObj.email, "Verify Your Pavo Tweak Account", `Welcome to Pavo Tweak!<br><br>Please verify your email address to activate your account by entering the following code:<br><div class="email-code-box">${code}</div>This code expires in 10 minutes.`);
                        
                        setAuthState('verify');
                        return;
                    }

                    // Reset count
                    delete failedLogins[loginForm.email.toLowerCase()];
                    db.set("pt_failed_logins", failedLogins);

                    db.setCurrentUser(userObj, loginForm.remember);
                    setUser(userObj);
                    triggerToast("Welcome Back", `Successfully logged in as ${userObj.username}.`, "success");
                    
                    // Route back to dashboard or complete checkout if cached
                    const pendingCheckout = sessionStorage.getItem("pt_pending_checkout");
                    if (pendingCheckout) {
                        sessionStorage.removeItem("pt_pending_checkout");
                        processOrderCompletion(userObj.email);
                    } else {
                        setView('dashboard');
                    }
                } else {
                    attempts.count++;
                    if (attempts.count >= 5) {
                        attempts.lockTime = Date.now() + 30 * 1000;
                        triggerToast("Security Lockout", "Too many attempts. Blocked for 30s.", "error");
                    } else if (attempts.count >= 3) {
                        setShowCaptcha(true);
                        triggerCaptchaGen();
                        triggerToast("Security Audit", "Math Captcha required to proceed.", "info");
                    } else {
                        triggerToast("Auth Failed", "Invalid email address or password.", "error");

                    failedLogins[loginForm.email.toLowerCase()] = attempts;
                    db.set("pt_failed_logins", failedLogins);

            const handleRegisterSubmit = (e) => {
                e.preventDefault();
                try {
                    let users = db.get("pt_users");

                    if (users.some(u => u.email.toLowerCase() === regForm.email.toLowerCase())) {
                        triggerToast("Registration Error", "This email address is already registered.", "error");
                        return;
                    }

                    if (regForm.password !== regForm.confirm) {
                        triggerToast("Registration Error", "Passwords do not match.", "error");
                        return;
                    }

                    // Write unverified user account to DB
                    const newU = {
                        username: regForm.username,
                        email: regForm.email,
                        passwordHash: hashPassword(regForm.password),
                        role: "user",
                        verified: false,
                        banned: false,
                        createdAt: new Date().toISOString(),
                        avatar: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=120&auto=format&fit=crop"
                    };
                    users.push(newU);
                    db.set("pt_users", users);

                    // Dispatch code mail
                    const code = generate6DigitCode();
                    const expires = Date.now() + 10 * 60 * 1000;
                    setVerificationCodes(prev => {
                        const current = Array.isArray(prev) ? prev : [];
                        return [...current.filter(c => c.email !== regForm.email), { email: regForm.email.toLowerCase(), code, exp: expires }];

                    sendMockMail(regForm.email, "Verify Your Pavo Tweak Account", `Welcome to Pavo Tweak!<br><br>Please verify your email address to complete registration by entering the following code:<br><div class="email-code-box">${code}</div>This code expires in 10 minutes.`);

                    setAuthState('verify');
                    setResendCooldown(60);

                    console.error("Register Error", err);

            const handleVerifySubmit = (e) => {
                e.preventDefault();

                    const currentCodes = Array.isArray(verificationCodes) ? verificationCodes : [];
                    const record = currentCodes.find(c => c.email.toLowerCase() === verifyEmailTarget.toLowerCase());

                    if (!record) {
                        triggerToast("Verification Failed", "No verification session found. Register again.", "error");
                        return;

                    if (Date.now() > record.exp) {
                        triggerToast("Verification Failed", "Code expired. Request a new one.", "error");
                        return;

                        return;

                    // Activate

                    users = users.map(u => {

                        return u;

                    db.set("pt_users", users);

                    // Clear records

                                <button onClick={() => setToasts(prev => prev.filter(x => x.id !== t.id))} className="text-brand-textMuted hover:text-white font-sans text-sm focus:outline-none">&times;</button>
                            </div>
                            <p className="text-[11px] text-brand-textMuted leading-relaxed">{t.message}</p>
                        </div>
                    ))}
                </div>
            );
        }

        // ==========================================================================
        // 13. CART DRAWER COMPONENT
        // ==========================================================================
        function CartDrawer({ isOpen, setIsOpen, cart, setCart, setCheckoutOpen }) {
            const handleRemoveItem = (id) => {
                const updated = cart.filter(item => item.id !== id);
                setCart(updated);
                db.set("pt_cart", updated);
            };

            const subtotal = cart.reduce((sum, item) => sum + item.price, 0);

            if (!isOpen) return null;

            return (
                <div className="fixed top-0 left-0 w-full h-full bg-black/60 backdrop-blur-sm z-[1100] flex justify-end" onClick={() => setIsOpen(false)}>
                    <div className="w-full max-w-[400px] h-full bg-brand-card border-l border-brand-border flex flex-col justify-between shadow-2xl slide-in-drawer" onClick={(e) => e.stopPropagation()}>
                        <div className="p-6 border-b border-brand-border flex justify-between items-center">
                            <h3 className="font-display font-black text-lg">Your Cart</h3>
                            <button onClick={() => setIsOpen(false)} className="p-2 hover:bg-white/5 border border-transparent hover:border-brand-border rounded-lg text-brand-textMuted hover:text-white focus:outline-none">
                                <Icon name="x" className="w-4 h-4" />
                            </button>
                        </div>

                        <div className="flex-grow p-6 overflow-y-auto flex flex-col gap-4 text-left">
                            {cart.length === 0 ? (
                                <p className="text-brand-textMuted text-sm text-center mt-12">Your cart is currently empty.</p>
                            ) : (
                                cart.map((item, idx) => (
                                    <div key={idx} className="bg-white/2 border border-brand-border p-4 rounded-xl flex gap-4 relative group">
                                        <img src="product_box.png" alt={item.name} className="w-14 h-16 object-cover rounded-lg shadow-md" />
                                        <div className="flex flex-col justify-center gap-1">
                                            <span className="font-semibold text-xs text-white">{item.name}</span>
                                            <span className="font-display font-black text-sm text-brand-blue">${item.price.toFixed(2)} USD</span>
                                        </div>
                                        <button onClick={() => handleRemoveItem(item.id)} className="absolute top-2 right-2 p-1.5 text-brand-textMuted hover:text-brand-red opacity-0 group-hover:opacity-100 transition-all focus:outline-none">
                                            <Icon name="trash-2" className="w-3.5 h-3.5" />
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>

                        <div className="p-6 border-t border-brand-border bg-black/20 flex flex-col gap-5">
                            <div className="flex justify-between items-center font-display font-black text-base">
                                <span>Subtotal</span>
                                <span className="text-brand-blue">${subtotal.toFixed(2)} USD</span>
                            </div>
                            <button 
                                disabled={cart.length === 0} 
                                onClick={() => { setIsOpen(false); setCheckoutOpen(true); }} 
                                className="bg-brand-blue hover:bg-brand-blueHover disabled:bg-brand-textMuted/10 disabled:text-brand-textMuted/40 disabled:cursor-not-allowed text-white font-semibold py-4 rounded-xl shadow-md hover:shadow-brand-blue/30 transition-all font-display tracking-wide text-center"
                            >
                                Proceed to Checkout
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================================================
        // 14. CHECKOUT MODAL COMPONENT

        function CheckoutModal({ isOpen, setIsOpen, user, cart, setCart, setView, setAuthState, setVerifyEmailTarget, sendMockMail, verificationCodes, setVerificationCodes, triggerToast }) {

            const ltcAddress = "LTu1AGw1L8Lp3L1vY4t9CtfD6j3qVwRk7z";

            const handleCopyAddress = () => {
                navigator.clipboard.writeText(ltcAddress);
                setCopied(true);
                triggerToast("Address Copied", "Litecoin address copied to clipboard.", "success");

                <div className="fixed top-0 left-0 w-full h-full bg-black/85 backdrop-blur-md z-[1200] flex justify-center items-center p-6" onClick={() => setIsOpen(false)}>
                    <div className="bg-brand-card border border-brand-border p-8 rounded-3xl w-full max-w-[800px] max-h-[90%] overflow-y-auto flex flex-col gap-6 shadow-2xl scale-in" onClick={(e) => e.stopPropagation()}>
                        <div className="flex justify-between items-center border-b border-brand-border pb-4">
                            <h3 className="font-display font-black text-xl">Secure Checkout</h3>
                            <button onClick={() => setIsOpen(false)} className="p-2 hover:bg-white/5 border border-transparent hover:border-brand-border rounded-lg text-brand-textMuted hover:text-white focus:outline-none">

                                    <h4 className="font-display font-bold text-xs text-brand-blue uppercase tracking-wider">Select Payment Method</h4>
                                    
                                    <div className="grid grid-cols-2 gap-3">
                                        {/* Litecoin */}
                                        <button 
                                            type="button"
                                            onClick={() => setMethod('ltc')}
                                            className={`p-4 rounded-xl border flex flex-col gap-1 items-start transition-all text-left focus:outline-none ${method === 'ltc' ? 'border-brand-blue bg-brand-blue/5' : 'border-brand-border bg-white/2 hover:border-white/10'}`}

                                            <span className="font-bold text-sm text-white">Litecoin (LTC)</span>
                                            <span className="text-[10px] text-brand-textMuted">Pay directly with crypto</span>
                                        </button>

                                        {/* PayPal */}

                                            type="button"
                                            onClick={() => setMethod('paypal')}
                                            className={`p-4 rounded-xl border flex flex-col gap-1 items-start transition-all text-left focus:outline-none ${method === 'paypal' ? 'border-brand-blue bg-brand-blue/5' : 'border-brand-border bg-white/2 hover:border-white/10'}`}
                                        >
                                            <span className="font-bold text-sm text-white">PayPal</span>
                                            <span className="text-[10px] text-brand-textMuted">Manual Discord purchase</span>
                                        </button>

                                        {/* Bitcoin */}
                                        <button 
                                            type="button"
                                            onClick={() => setMethod('btc')}
                                            className={`p-4 rounded-xl border flex flex-col gap-1 items-start transition-all text-left focus:outline-none ${method === 'btc' ? 'border-brand-blue bg-brand-blue/5' : 'border-brand-border bg-white/2 hover:border-white/10'}`}
                                        >
                                            <span className="font-bold text-sm text-white">Bitcoin (BTC)</span>
                                            <span className="text-[10px] text-brand-textMuted">Manual Discord purchase</span>
                                        </button>

                                        {/* Ethereum */}
                                        <button 
                                            type="button"
                                            onClick={() => setMethod('eth')}
                                            className={`p-4 rounded-xl border flex flex-col gap-1 items-start transition-all text-left focus:outline-none ${method === 'eth' ? 'border-brand-blue bg-brand-blue/5' : 'border-brand-border bg-white/2 hover:border-white/10'}`}
                                        >
                                            <span className="font-bold text-sm text-white">Ethereum (ETH)</span>
                                            <span className="text-[10px] text-brand-textMuted">Manual Discord purchase</span>
                                        </button>
                                    </div>
                                </div>

                                <hr className="border-brand-border/50" />

                                {/* Payment Details Section */}
                                {method === 'ltc' ? (
                                    <div className="flex flex-col gap-4 scale-in">
                                        <h5 className="font-display font-bold text-xs text-brand-blue uppercase tracking-wider">Litecoin Payment Instructions</h5>
                                        <p className="text-xs text-brand-textMuted leading-relaxed">
                                            To complete your purchase of Pavo Tweak Lifetime access via Litecoin (LTC), please send exactly **$8.00 USD** equivalent in LTC to the address below:
                                        </p>
                                        
                                        <div className="bg-white/2 border border-brand-border p-4 rounded-xl flex flex-col gap-2">
                                            <span className="text-[9px] font-bold text-brand-textMuted uppercase tracking-wider">Litecoin (LTC) Address</span>
                                            <div className="flex gap-2">
                                                <input 
                                                    type="text" 
                                                    readOnly 
                                                    value={ltcAddress} 
                                                    className="bg-black/30 border border-brand-border rounded-lg px-3 py-2 text-xs font-mono text-white flex-grow select-all focus:outline-none" 
                                                />
                                                <button 
                                                    type="button"
                                                    onClick={handleCopyAddress}
                                                    className="bg-brand-blue hover:bg-brand-blueHover text-white font-semibold text-xs px-4 py-2 rounded-lg transition-all focus:outline-none"
                                                >
                                                    {copied ? 'Copied' : 'Copy'}
                                                </button>
                                            </div>
                                        </div>

                                        <div className="bg-white/2 border border-brand-border p-4 rounded-xl flex flex-col gap-3">
                                            <span className="text-[10px] font-bold text-white uppercase tracking-wider">Step 2: Verify Your Payment</span>
                                            <p className="text-xs text-brand-textMuted leading-relaxed">
                                                Once you have broadcast the transaction, join our Discord server, open a billing support ticket, and share your TXID or payment proof. We will manually verify the payment and compile your key.
                                            </p>
                                            <a 
                                                href={discordLink} 
                                                target="_blank" 
                                                rel="noopener noreferrer"
                                                className="bg-brand-blue hover:bg-brand-blueHover text-white font-semibold py-3 rounded-xl transition-all font-display text-xs tracking-wide text-center mt-2 flex items-center justify-center gap-2"
                                            >
                                                <span>Join Discord to Verify</span>
                                            </a>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="flex flex-col gap-4 scale-in py-4 text-center items-center justify-center">
                                        <div className="w-12 h-12 rounded-full bg-brand-blue/10 border border-brand-blue/25 flex items-center justify-center text-brand-blue mb-2">
                                            <Icon name="message-square" className="w-6 h-6" />
                                        </div>
                                        <h5 className="font-display font-black text-base text-white">Manual Discord Purchase</h5>
                                        <p className="text-xs text-brand-textMuted max-w-sm leading-relaxed mb-4">
                                            PayPal, Bitcoin, and Ethereum payments are processed manually by our staff. Click the button below to join our Discord server and open a ticket.
                                        </p>
                                        <a 
                                            href={discordLink} 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            className="bg-brand-blue hover:bg-brand-blueHover text-white font-semibold px-8 py-4 rounded-xl transition-all font-display text-sm tracking-wide text-center flex items-center justify-center gap-2 shadow-lg shadow-brand-blue/20"
                                        >
                                            <span>Join Discord Server</span>
                                        </a>
                                    </div>
                                )}
                            </div>

                            {/* Right column: Order Summary */}
                            <div className="lg:col-span-5 border-l border-brand-border/60 lg:pl-8 flex flex-col gap-5">

                                <div className="bg-white/2 border border-brand-border p-4 rounded-xl flex gap-3.5">
                                    <img src="product_box.png" alt="Pavo Tweak" className="w-12 h-14 object-cover rounded shadow" />
                                    <div className="flex flex-col justify-center flex-grow">
                                        <span className="font-semibold text-xs">Pavo Tweak Lifetime</span>
                                        <span className="text-[10px] text-brand-textMuted">Quantity: 1</span>
                                    </div>
                                    <span className="font-display font-black text-sm text-brand-blue flex items-center">$8.00</span>
                                </div>

                                <hr className="border-brand-border/50" />
                                
                                <div className="flex justify-between items-center font-display font-black text-md">
                                    <span>Total Due</span>
                                    <span className="text-brand-blue">$8.00 USD</span>
                                </div>

                                <div className="bg-[#0b0c10] border border-brand-border/80 rounded-xl p-4 flex gap-3 text-xs leading-relaxed text-brand-textMuted items-start mt-2">
                                    <Icon name="shield-check" className="w-5 h-5 text-brand-blue flex-shrink-0 mt-0.5" />
                                    <span>Secure checkout. Direct payment instructions or server transitions are secured using standard encryptions.</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================================================
        // 15. FLOATING EMAIL CLIENT COMPONENT
        // ==========================================================================
        function EmailClient({ isOpen, setIsOpen, unreadCount, mailList, setMailList, updateUnreadCount, activeMail, setActiveMail }) {
            const handleExpandInbox = (e) => {
                e.stopPropagation();
                setIsOpen(!isOpen);
                
                // Clear unreads when expanding drawer
                if (isOpen) {
                    const readMails = mailList.map(m => ({ ...m, unread: false }));
                    setMailList(readMails);
                    db.set("pt_mails", readMails);
                    updateUnreadCount(readMails);
                }
            };

            const openMailDetail = (idx) => {
                const mail = mailList[idx];
                mail.unread = false;
                const updated = [...mailList];
                updated[idx] = mail;
                setMailList(updated);
                db.set("pt_mails", updated);
                updateUnreadCount(updated);
                setActiveMail(mail);
            };

            return (
                <div className={`fixed bottom-0 right-6 w-full max-w-[420px] bg-[#0d0e12] border border-brand-border rounded-t-2xl shadow-2xl z-[1000] flex flex-col transition-all duration-400 ease-[cubic-bezier(0.16,1,0.3,1)] ${isOpen ? 'h-[385px]' : 'h-[50px] overflow-hidden'}`}>
                    <div onClick={handleExpandInbox} className="bg-[#111319] border-b border-brand-border px-4 py-3 flex justify-between items-center cursor-pointer rounded-t-2xl">
                        <div className="flex items-center gap-2 text-xs">
                            <span className="w-2.5 h-2.5 rounded-full bg-brand-blue animate-pulse shadow-md shadow-brand-blue/35" />
                            <strong className="text-white">PavoMail Delivery node</strong>
                        </div>
                        <div className="flex items-center gap-2">
                            {unreadCount > 0 && (
                                <span className="bg-brand-red text-white text-[10px] font-bold min-w-[16px] h-4 rounded-full flex items-center justify-center px-1 scale-in">{unreadCount}</span>
                            )}
                            <Icon name="chevron-up" className={`w-4 h-4 text-brand-textMuted transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`} />
                        </div>
                    </div>

                    {isOpen && (
                        <div className="flex-grow overflow-hidden relative">
                            {/* Inbox index */}
                            {!activeMail ? (
                                <div className="w-full h-full p-4 overflow-y-auto flex flex-col gap-2 text-left">
                                    {mailList.length === 0 ? (
                                        <p className="text-xs text-brand-textMuted text-center mt-20 leading-relaxed">No emails received. Complete a Registration or Request Password Recovery to trigger a simulated mail payload here.</p>
                                    ) : (
                                        mailList.map((m, idx) => (
                                            <div key={idx} onClick={() => openMailDetail(idx)} className={`border border-brand-border rounded-lg p-3 hover:bg-white/4 cursor-pointer flex flex-col gap-1 transition-colors ${m.unread ? 'border-l-4 border-l-brand-blue bg-brand-blue/2' : 'bg-white/2'}`}>
                                                <div className="flex justify-between items-center text-[10px] text-brand-textMuted">
                                                    <span className="font-bold text-brand-blue">{m.from}</span>
                                                    <span>{m.time}</span>
                                                </div>
                                                <span className="font-display font-bold text-xs text-white truncate">{m.subject}</span>
                                                <span className="text-[11px] text-brand-textMuted truncate">Click to read details and copy code...</span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            ) : (
                                /* Mail detail */
                                <div className="w-full h-full p-4 overflow-y-auto text-left flex flex-col gap-4">
                                    <button onClick={() => setActiveMail(null)} className="flex items-center gap-1 text-xs font-semibold text-brand-blue hover:text-white transition-colors focus:outline-none">
                                        <Icon name="arrow-left" className="w-3.5 h-3.5" /> Back to Inbox
                                    </button>
                                    <div className="text-[11px] border-b border-brand-border pb-3 flex flex-col gap-1 text-brand-textMuted leading-relaxed">
                                        <p><strong>From:</strong> {activeMail.from}</p>
                                        <p><strong>To:</strong> {activeMail.to}</p>
                                        <p><strong>Subject:</strong> <span className="text-white font-semibold">{activeMail.subject}</span></p>
                                        <p><strong>Time:</strong> {activeMail.time}</p>
                                    </div>
                                    <div className="email-body-markup text-xs text-brand-textMuted" dangerouslySetInnerHTML={{ __html: activeMail.body }} />
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================================================
        // 16. LEGAL DOCUMENTS MODAL COMPONENT
        // ==========================================================================

            const content = {
                terms: {
                    title: "Terms of Service",
                    body: `

                        <p class="mb-4">By accessing Pavo Tweak website and downloading the software suite, you agree to comply with and be bound by these Terms of Service. These terms constitute a legally binding agreement between you and Pavo Tweak.</p>

                        <p class="mb-4">We hold your username, email, and password (in highly secured hashed format) to compile licenses, process downloads, and permit dashboard access. This data is never shared with third parties.</p>

                        <p class="mb-4">We use local storage values to maintain session configurations and cart state details to ensure proper UI performance.</p>
                    `
                },
                refund: {
                    title: "Refund Policy",
                    body: `
                        <h4 class="font-display font-bold text-white text-sm uppercase mt-4 mb-2">1. Refund Policies</h4>
                        <p class="mb-4">Due to the digital nature of lifetime software license keys, we generally do not offer refunds once a license key has been compiled and activated.</p>
                        
                        <h4 class="font-display font-bold text-white text-sm uppercase mt-4 mb-2">2. Exceptions</h4>
                        <p class="mb-4">If you encounter severe hardware incompatibility issues that prevent Pavo Tweak from running altogether, contact support@pavotweak.com within 7 days of purchase. Our engineers will verify system crash logs and, if unresolved, execute a full refund transaction.</p>
                    `
                }
            };

            const doc = content[type];

            return (
                <div className="fixed top-0 left-0 w-full h-full bg-black/80 backdrop-blur-sm z-[1300] flex justify-center items-center p-6" onClick={() => setType(null)}>
                    <div className="bg-brand-card border border-brand-border p-8 rounded-2xl w-full max-w-[650px] max-h-[85%] overflow-y-auto flex flex-col gap-6 shadow-2xl scale-in text-left" onClick={(e) => e.stopPropagation()}>
                        <div className="flex justify-between items-center border-b border-brand-border pb-4">
                            <h3 className="font-display font-black text-xl">{doc.title}</h3>
                            <button onClick={() => setType(null)} className="p-2 hover:bg-white/5 border border-transparent hover:border-brand-border rounded-lg text-brand-textMuted hover:text-white focus:outline-none">
                                <Icon name="x" className="w-4 h-4" />
                            </button>
                        </div>
                        <div className="text-xs text-brand-textMuted leading-relaxed" dangerouslySetInnerHTML={{ __html: doc.body }} />
                    </div>
                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
