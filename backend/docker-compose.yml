version: '3.8'

services:
  license-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pavo-license-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - ADMIN_API_KEY=${ADMIN_API_KEY:-pavo_admin_secret_key_prod_2026_super_secure}
      - SIGNING_SECRET=${SIGNING_SECRET:-pavo_client_hmac_signing_secret_998877665544332211}
      - DB_PATH=/app/data/licenses.db
      - RATE_LIMIT_PUBLIC=120
      - RATE_LIMIT_ADMIN=500
    volumes:
      # Persistent SQLite volume surviving restarts & upgrades
      - pavo_license_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pavo_license_data:
    driver: local
