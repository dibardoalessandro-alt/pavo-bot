name: Keep Cloud Bot & Backend Online

on:
  schedule:
    # Run every 5 minutes 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Pavo Unified Suite
        run: |
          echo "Sending keep-alive ping to cloud service..."
          curl -s -o /dev/null -w "Unified Suite Status: %{http_code}\n" -m 30 "https://pavo-suite.onrender.com/health" || true
          curl -s -o /dev/null -w "Bot-1 Status: %{http_code}\n" -m 30 "https://pavo-bot-1.onrender.com/health" || true
          echo "Keep-alive ping completed."
