# Render Blueprint - Pavo Discord Bot
# https://render.com/docs/blueprint-spec

databases:
  - name: pavo-db
    plan: free
    region: frankfurt
    databaseName: pavo_bot
    user: pavo_bot

services:
  - type: web
    name: pavo-bot
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DISCORD_TOKEN
        sync: false  # Set in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: pavo-db
          property: connectionString
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
